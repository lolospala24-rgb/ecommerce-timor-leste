user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    # 500m headroom for video uploads (Cloudinary's own free-tier cap is
    # 100MB per video, but this must be >= that or nginx rejects the
    # request before it ever reaches the backend / Cloudinary's own check).
    client_max_body_size 500m;

    # Shared TLS settings for every HTTPS server block below.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ------------------------------------------------------------------
    # Bare-IP / unrecognized Host fallback — kept for backward compatibility
    # so http://72.61.151.58 still resolves to the storefront. No cert
    # exists for a bare IP, so this stays plain HTTP.
    # ------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------------------------------------------------------------------
    # Storefront (frontend-ecommerce) — lolospala.com / www.lolospala.com
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name lolospala.com www.lolospala.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name lolospala.com www.lolospala.com;

        ssl_certificate /etc/letsencrypt/live/lolospala.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lolospala.com/privkey.pem;

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------------------------------------------------------------------
    # Admin panel — admin.lolospala.com
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name admin.lolospala.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name admin.lolospala.com;

        ssl_certificate /etc/letsencrypt/live/lolospala.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lolospala.com/privkey.pem;

        location / {
            proxy_pass http://admin:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------------------------------------------------------------------
    # Backend API — api.lolospala.com
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name api.lolospala.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.lolospala.com;

        ssl_certificate /etc/letsencrypt/live/lolospala.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lolospala.com/privkey.pem;

        # Socket.IO (notifications gateway) needs the Upgrade/Connection
        # headers forwarded, or the WebSocket handshake falls back to
        # failing long-polling requests behind this proxy.
        location /socket.io/ {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Default 60s is too short for a large video upload on a modest
            # connection — nginx would cut the request before Cloudinary
            # even finishes receiving it.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # ------------------------------------------------------------------
    # Legacy IP+port routes — kept temporarily as a rollback safety net
    # during the domain cutover. Remove once the domain-based HTTPS routes
    # above are fully verified (see Phase 9 of the migration).
    # ------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://admin:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8081;
        server_name _;

        location /socket.io/ {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
