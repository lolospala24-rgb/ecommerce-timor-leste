user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    # 500m headroom for video uploads (Cloudinary's own free-tier cap is
    # 100MB per video, but this must be >= that or nginx rejects the
    # request before it ever reaches the backend / Cloudinary's own check).
    client_max_body_size 500m;

    # ------------------------------------------------------------------
    # Storefront (frontend-ecommerce) — catch-all / default server, so a
    # bare IP hit (before any domain is pointed here) still shows the site.
    # Once you have a domain, replace `server_name _;` below with your real
    # domain (e.g. `ecommercetimor.com www.ecommercetimor.com;`).
    # ------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------------------------------------------------------------------
    # Admin panel — no domain yet, so reachable via http://SEU_IP:8080
    # directly. Once you have a domain, change this to `listen 80;` with
    # `server_name admin.YOURDOMAIN.com;` and drop the 8080 port mapping
    # in docker-compose.prod.yml.
    # ------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://admin:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------------------------------------------------------------------
    # Backend API — no domain yet, so reachable via http://SEU_IP:8081
    # directly. Once you have a domain, change this to `listen 80;` with
    # `server_name api.YOURDOMAIN.com;` and drop the 8081 port mapping
    # in docker-compose.prod.yml.
    # ------------------------------------------------------------------
    server {
        listen 8081;
        server_name _;

        # Socket.IO (notifications gateway) needs the Upgrade/Connection
        # headers forwarded, or the WebSocket handshake falls back to
        # failing long-polling requests behind this proxy.
        location /socket.io/ {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Default 60s is too short for a large video upload on a modest
            # connection — nginx would cut the request before Cloudinary
            # even finishes receiving it.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
