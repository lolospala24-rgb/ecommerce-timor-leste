<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Seller Panel</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fbfbf8; color: #22321f;
  }
  .card { text-align: center; padding: 2rem; max-width: 320px; }
  .icon {
    width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 14px;
    background: #2f5741; color: #fff; display: flex; align-items: center;
    justify-content: center; font-size: 28px; font-weight: 700;
  }
  h1 { font-size: 1.05rem; margin: 0 0 .5rem; }
  p { font-size: .875rem; color: #5a6b57; margin: 0 0 1.25rem; }
  button {
    border: none; background: #2f5741; color: #fff; padding: .6rem 1.1rem;
    border-radius: 8px; font-size: .875rem; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">S</div>
    <h1>You're offline</h1>
    <p>The Seller Panel needs a connection to load your store data. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
